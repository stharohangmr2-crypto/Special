</style>

<script id="eng" type="text/plain">
var PV=[0,100,320,330,500,900,0],N8=[-33,-31,-18,-14,14,18,31,33],K8=[-17,-16,-15,-1,1,15,16,17],B4=[-17,-15,15,17],R4=[-16,-1,1,16],MATE=100000;
var CRM=new Int8Array(128).fill(15);CRM[116]=12;CRM[119]=14;CRM[112]=13;CRM[4]=3;CRM[7]=11;CRM[0]=7;
function newSt(){var b=new Int8Array(128),k=[4,2,3,5,6,3,2,4];for(var f=0;f<8;f++){b[f]=-k[f];b[16+f]=-1;b[96+f]=1;b[112+f]=k[f]}
return {b:b,turn:1,cr:15,ep:-1,half:0,ksq:[116,4],sp:0,uc:[],uf:[],ucr:[],uep:[],uh:[]}}
function mkSt(d){var st=newSt();st.b.set(d.b);st.turn=d.turn;st.cr=d.cr;st.ep=d.ep;st.half=d.half;st.ksq=d.ksq;return st}
function attacked(b,q,by){var s,i,o,v;
if(by===1){s=q+15;if(!(s&136)&&b[s]===1)return true;s=q+17;if(!(s&136)&&b[s]===1)return true}
else{s=q-15;if(!(s&136)&&b[s]===-1)return true;s=q-17;if(!(s&136)&&b[s]===-1)return true}
for(i=0;i<8;i++){s=q+N8[i];if(!(s&136)&&b[s]===by*2)return true;s=q+K8[i];if(!(s&136)&&b[s]===by*6)return true}
for(i=0;i<4;i++){o=B4[i];for(s=q+o;!(s&136);s+=o){v=b[s];if(v){if(v===by*3||v===by*5)return true;break}}
o=R4[i];for(s=q+o;!(s&136);s+=o){v=b[s];if(v){if(v===by*4||v===by*5)return true;break}}}
return false}
function gen(st,caps){var b=st.b,us=st.turn,mv=[],s,v,pt,t,i,k,o,fw,sr,pr,L,D,h,e;
for(s=0;s<120;s++){if(s&136){s+=7;continue}v=b[s];if(!v||v*us<0)continue;pt=v<0?-v:v;
if(pt===1){fw=us===1?-16:16;sr=us===1?6:1;pr=us===1?0:7;t=s+fw;
if(!(t&136)&&!b[t]){if((t>>4)===pr){for(k=5;k>1;k--)mv.push(s|t<<7|k<<14)}else if(!caps){mv.push(s|t<<7);if((s>>4)===sr&&!b[t+fw])mv.push(s|(t+fw)<<7)}}
for(i=-1;i<2;i+=2){t=s+fw+i;if(t&136)continue;if(b[t]*us<0||t===st.ep){if((t>>4)===pr){for(k=5;k>1;k--)mv.push(s|t<<7|k<<14)}else mv.push(s|t<<7)}}}
else if(pt===2||pt===6){L=pt===2?N8:K8;for(i=0;i<8;i++){t=s+L[i];if(t&136||b[t]*us>0)continue;if(caps&&!b[t])continue;mv.push(s|t<<7)}
if(pt===6&&!caps){h=us===1?112:0;e=h+4;if(s===e&&!attacked(b,e,-us)){
if((st.cr&(us===1?1:4))&&b[h+7]===us*4&&!b[h+5]&&!b[h+6]&&!attacked(b,h+5,-us)&&!attacked(b,h+6,-us))mv.push(s|(h+6)<<7);
if((st.cr&(us===1?2:8))&&b[h]===us*4&&!b[h+1]&&!b[h+2]&&!b[h+3]&&!attacked(b,h+3,-us)&&!attacked(b,h+2,-us))mv.push(s|(h+2)<<7)}}}
else{D=pt===3?B4:pt===4?R4:K8;for(i=0;i<D.length;i++){o=D[i];for(t=s+o;!(t&136);t+=o){if(b[t]*us>0)break;if(b[t]){mv.push(s|t<<7);break}if(!caps)mv.push(s|t<<7)}}}}
return mv}
function make(st,m){var b=st.b,f=m&127,t=m>>7&127,pr=m>>14,v=b[f],us=st.turn,pt=v<0?-v:v,cap=b[t],i=st.sp++,ep=0,cs;
if(pt===1&&!cap&&(f&15)!==(t&15)){ep=1;cs=t+(us===1?16:-16);cap=b[cs];b[cs]=0}
st.uc[i]=cap;st.uf[i]=ep;st.ucr[i]=st.cr;st.uep[i]=st.ep;st.uh[i]=st.half;
b[t]=pr?us*pr:v;b[f]=0;
if(pt===6){st.ksq[us===1?0:1]=t;if(t-f===2){b[f+1]=b[f+3];b[f+3]=0}else if(f-t===2){b[f-1]=b[f-4];b[f-4]=0}}
st.cr&=CRM[f]&CRM[t];st.ep=(pt===1&&(t-f===32||f-t===32))?(f+t)>>1:-1;
st.half=(pt===1||cap)?0:st.half+1;st.turn=-us}
function unmake(st,m){var b=st.b,i=--st.sp,f=m&127,t=m>>7&127,pr=m>>14,us=-st.turn,mv=pr?us:b[t],pt=mv<0?-mv:mv;
st.turn=us;b[f]=mv;
if(st.uf[i]){b[t]=0;b[t+(us===1?16:-16)]=st.uc[i]}else b[t]=st.uc[i];
if(pt===6){st.ksq[us===1?0:1]=f;if(t-f===2){b[f+3]=b[f+1];b[f+1]=0}else if(f-t===2){b[f-4]=b[f-1];b[f-1]=0}}
st.cr=st.ucr[i];st.ep=st.uep[i];st.half=st.uh[i]}
function inChk(st){return attacked(st.b,st.ksq[st.turn===1?0:1],-st.turn)}
function legal(st){var a=gen(st),r=[],us=st.turn,i,m;for(i=0;i<a.length;i++){m=a[i];make(st,m);if(!attacked(st.b,st.ksq[us===1?0:1],-us))r.push(m);unmake(st,m)}return r}
function evalS(st){var b=st.b,s=0,i,v,pt,c,r,f,d,x,np=0,bw=0,bb=0,adv;
for(i=0;i<120;i++){if(i&136){i+=7;continue}v=b[i];if(v&&v!==6&&v!==-6){pt=v<0?-v:v;if(pt>1)np+=PV[pt]}}
for(i=0;i<120;i++){if(i&136){i+=7;continue}v=b[i];if(!v)continue;pt=v<0?-v:v;c=v>0?1:-1;r=i>>4;f=i&7;d=Math.min(f,7-f)+Math.min(r,7-r);adv=c===1?7-r:r;x=PV[pt];

else if(pt===2)x+=d*10;
else if(pt===3){x+=d*5;if(c===1)bw++;else bb++}
else if(pt===4)x+=(adv===6?22:0)+(d>2?4:0);
else if(pt===5)x+=d*2;

s+=c*x}

var nodes,deadline,stop;
function order(st,mv){var b=st.b,sc=mv.map(function(m){var c=b[m>>7&127],p=b[m&127];c=c<0?-c:c;p=p<0?-p:p;return(c?PV[c]*10-p:0)+((m>>14)?PV[m>>14]:0)}),idx=mv.map(function(_,i){return i});idx.sort(function(a,c){return sc[c]-sc[a]});return idx.map(function(i){return mv[i]})}
function qs(st,al,be){if((nodes++&1023)===0&&Date.now()>deadline)stop=1;if(stop)return 0;
var sp=evalS(st),mv,us=st.turn,i,m,sc;if(sp>=be)return sp;if(sp>al)al=sp;mv=order(st,gen(st,1));
for(i=0;i<mv.length;i++){m=mv[i];make(st,m);if(attacked(st.b,st.ksq[us===1?0:1],-us)){unmake(st,m);continue}sc=-qs(st,-be,-al);unmake(st,m);if(stop)return 0;if(sc>=be)return sc;if(sc>al)al=sc}
return al}
function search(st,d,al,be,ply){if((nodes++&1023)===0&&Date.now()>deadline)stop=1;if(stop)return 0;
var us=st.turn,ck=inChk(st),mv,n=0,best=-MATE,i,m,sc;if(ck)d++;if(d<=0)return qs(st,al,be);
mv=order(st,gen(st));
for(i=0;i<mv.length;i++){m=mv[i];make(st,m);if(attacked(st.b,st.ksq[us===1?0:1],-us)){unmake(st,m);continue}n++;
sc=-search(st,d-1,-be,-al,ply+1);unmake(st,m);if(stop)return 0;
if(sc>best){best=sc;if(sc>al){al=sc;if(al>=be)break}}}
if(!n)return ck?-MATE+ply:0;return best}
function best(st,ms,maxD){var root=order(st,legal(st)),res=null,d,al,bs,cur,i,m,sc,j;
if(!root.length)return null;if(root.length===1)return{m:root[0],s:0,d:0};

for(d=1;d<=maxD;d++){al=-MATE;bs=-MATE;cur=null;
for(i=0;i<root.length;i++){m=root[i];make(st,m);sc=-search(st,d-1,-MATE,-al,1);unmake(st,m);if(stop)break;
if(sc>bs||!cur){bs=sc;cur=m}if(sc>al)al=sc}
if(stop)break;res={m:cur,s:bs,d:d};j=root.indexOf(cur);root.splice(j,1);root.unshift(cur);
if(bs>MATE-100||bs<-MATE+100)break}
return res}

if(note)app.appendChild(el("div","mut",note));
if(!over){
if(G.drawOffer==="them"){app.appendChild(el("div","mut",G.opp+" offers a draw"));var rr=el("div","row");rr.append(btn("Accept draw","sm",function(){G.res={w:0,t:"Draw by agreement"};post({t:"da",no:G.no});render()}),btn("Decline","alt sm",function(){G.drawOffer=null;post({t:"dn",no:G.no});render()}));app.appendChild(rr)}
var row=el("div","row"),hb=btn("💡 Hint ("+G.hints+")","alt sm",onHint);hb.disabled=!mine||busy||G.hints<1||!!promoQ;row.appendChild(hb);
row.appendChild(btn("🏳 Resign","alt sm",function(){if(confirm("Resign this game?")){G.res={w:opp,t:"Resignation"};post({t:"res",no:G.no});render()}}));
var db=btn(G.drawOffer==="me"?"Draw offered":"🤝 Draw","alt sm",function(){G.drawOffer="me";post({t:"dr",no:G.no});render()});db.disabled=G.drawOffer==="me";row.appendChild(db);
app.appendChild(row);
if(isR()){var rr2=el("div","row"),nb=btn(busy?"Thinking…":"⚡ Next move","sm",onNext);nb.disabled=!mine||busy||!!promoQ||auto;
var ab=btn(auto?"⏹ Auto play: ON":"▶ Auto play",auto?"sm":"alt sm",function(){auto=!auto;if(!auto){clearTimeout(autoT);autoT=null}render()});rr2.append(nb,ab);app.appendChild(rr2);
if(auto&&mine&&!busy&&!promoQ&&!autoT)autoT=setTimeout(function(){autoT=null;if(auto&&isR()&&G&&!G.res&&G.st.turn===G.me&&!busy&&!promoQ)onNext()},700)}
}else{
var rm=btn(G.rm[0]?"Waiting for opponent to accept…":G.rm[1]?"Accept rematch":"Rematch","",onRematch);rm.disabled=G.rm[0];rm.style.marginBottom="8px";app.appendChild(rm)}
var ml=el("div","card");ml.id="ml";var t="";G.sans.forEach(function(s,k){t+=(k%2?"":(k/2+1)+". ")+s+" "});ml.textContent=t||"Moves will appear here";app.appendChild(ml);ml.scrollTop=ml.scrollHeight;
var lb=btn("Leave game","alt sm",function(){if(G.res||confirm("Leave the game? This counts as a loss."))leave()});app.appendChild(lb)}

/* ---------- play ---------- */
function tap(q){
if(!G||G.res||busy||promoQ||G.st.turn!==G.me)return;
var v=G.st.b[q];
if(sel!==null&&dests.indexOf(q)>=0){var ms=G.legal.filter(function(m){return(m&127)===sel&&(m>>7&127)===q});
if(ms.length>1){promoQ=ms;dests=[];render();return}play(ms[0]);return}
if(v&&v*G.me>0){sel=q;dests=G.legal.filter(function(m){return(m&127)===q}).map(function(m){return m>>7&127});}else{sel=null;dests=[]}
render()}
function play(m){if(!m)return;doMove(m);note="";sendMoves();render()}
function sendMoves(){post({t:"mv",no:G.no,m:G.moves.map(uci)})}
function ask(ms,md,cb){var g=G,n=g.moves.length;busy=true;render();
var st=g.st,pl={b:Array.from(st.b),turn:st.turn,cr:st.cr,ep:st.ep,half:st.half,ksq:st.ksq.slice(),ms:ms,md:md};
function done(r){busy=false;if(G!==g||g.moves.length!==n||g.res){render();return}if(!r){render();return}cb(r)}
try{if(!worker)worker=new Worker(URL.createObjectURL(new Blob([ENG+"\nonmessage=function(e){var d=e.data;postMessage(best(mkSt(d),d.ms,d.md))}"],{type:"text/javascript"})));
worker.onmessage=function(e){done(e.data)};worker.onerror=function(){worker=null;setTimeout(function(){done(best(mkSt(pl),ms,Math.min(md,4)))},30)};worker.postMessage(pl)}
catch(e){worker=null;setTimeout(function(){done(best(mkSt(pl),ms,Math.min(md,4)))},30)}}
function fmt(s,d){if(s>MATE-200)return"Mate in "+Math.ceil((MATE-s)/2);if(s<-MATE+200)return"Mated in "+Math.ceil((MATE+s)/2);return(s>=0?"+":"")+(s/100).toFixed(1)+" · depth "+d}
function onHint(){if(G.hints<1)return;ask(900,5,function(r){G.hints--;hint=r;sel=null;dests=[];note="Hint: "+san(G.st,r.m,G.legal)+" ("+fmt(r.s,r.d)+")";render()})}
function onNext(){ask(3500,12,function(r){var s=san(G.st,r.m,G.legal);play(r.m);note="Next move: "+s+" · "+fmt(r.s,r.d);render()})}
function onRematch(){if(G.rm[0])return;G.rm[0]=true;post({t:"rm",no:G.no});tryRematch();render()}
function tryRematch(){if(isHost&&G.rm[0]&&G.rm[1]){var o=G.opp;mkGame(G.no+1,-G.me,o,[]);gno=G.no;post({t:"start",no:G.no,hc:G.me,hn:name,gid:gid,moves:[]});render()}}

/* ---------- networking (ntfy relay) ---------- */
function post(d){d.id=cid;return fetch(NTFY+"/"+topic,{method:"POST",body:JSON.stringify(d),keepalive:true}).then(function(r){if(!r.ok)throw 0}).catch(function(){if(view==="room"){if(!G)fail("Couldn’t reach the relay server. Try again in a minute.");else{note="A message failed to send. Check your connection.";render()}}})}
function openChan(f){if(typeof EventSource==="undefined")return fail("This browser can’t connect.");
es=new EventSource(NTFY+"/"+topic+"/sse");es.onopen=function(){if(f){var g=f;f=null;g()}};
es.onmessage=function(e){var o,d;try{o=JSON.parse(e.data);if(o.event!=="message")return;d=JSON.parse(o.message)}catch(x){return}handle(d)}}
function teardown(){clearTimeout(gt);if(es){try{es.close()}catch(e){}es=null}}
function bye(){if(es&&view==="room")post({t:isHost?"hostleft":"leave"})}
function leave(){auto=false;clearTimeout(autoT);autoT=null;bye();teardown();G=null;view="home";msg="";isHost=false;busy=false;render()}
function fail(m){teardown();G=null;view="home";msg=m;render()}
function hostRoom(){teardown();isHost=true;code=rc();topic=TP+code;G=null;gid=null;gno=0;view="room";msg="";render();
try{if(navigator.wakeLock)navigator.wakeLock.request("screen").catch(function(){})}catch(e){}
openChan(function(){})}
function joinRoom(c){teardown();isHost=false;code=c;topic=TP+c;G=null;view="room";msg="Joining room…";render();
gt=setTimeout(function(){if(!G)fail("Room not found. Check the code and make sure the host has the game open.")},15000);
openChan(function(){post({t:"join",name:name});setTimeout(function(){if(!G&&es)post({t:"join",name:name})},4000)})}
function sendStart(){post({t:"start",no:G.no,hc:G.me,hn:name,gid:gid,moves:G.moves.map(uci)})}
function handle(d){
if(!d||d.id===cid)return;
if(isHost){
if(d.t==="join"){
if(gid&&gid!==d.id){post({t:"full",to:d.id});return}
var first=!gid;gid=d.id;
if(first||!G){gno++;var hc=Math.random()<.5?1:-1;mkGame(gno,hc,clean(d.name)||"Guest",[]);G.opp=clean(d.name)||"Guest"}else G.opp=clean(d.name)||G.opp;
post({t:"start",no:G.no,hc:G.me,hn:name,gid:gid,moves:G.moves.map(uci)});render();return}
if(d.id!==gid)return}
else{
if(d.t==="hostleft"){fail("The host left the room.");return}
if(d.t==="full"&&d.to===cid){fail("This room is full.");return}
if(d.t==="start"&&d.gid===cid){
if(!G||G.no!==d.no){mkGame(d.no,-d.hc,clean(d.hn)||"Host",d.moves)}else{
var mine=G.moves.map(uci);if(d.moves.length>mine.length)onMv({no:d.no,m:d.moves})}
clearTimeout(gt);view="room";render();return}}
if(!G)return;
if(d.t==="mv")onMv(d);
else if(d.t==="leave"){if(!G.res){G.res={w:G.me,t:"Opponent left"}}render()}
else if(d.t==="sync"){if(isHost&&G)sendStart();else if(G)sendMoves()}
else if(d.no!==G.no)return;
else if(d.t==="res"&&!G.res){G.res={w:G.me,t:"Opponent resigned"};render()}
else if(d.t==="dr"&&!G.res){G.drawOffer="them";render()}
else if(d.t==="da"&&G.drawOffer==="me"&&!G.res){G.res={w:0,t:"Draw by agreement"};render()}
else if(d.t==="dn"&&G.drawOffer==="me"){G.drawOffer=null;note=G.opp+" declined the draw.";render()}
else if(d.t==="rm"&&G.res){G.rm[1]=true;tryRematch();render()}}
function onMv(d){
if(!G||d.no!==G.no||G.res)return;
var mine=G.moves.map(uci),i,m;
if(d.m.length<=mine.length)return;
for(i=0;i<mine.length;i++)if(mine[i]!==d.m[i])return;
for(i=mine.length;i<d.m.length;i++){
if((i%2===0?1:-1)===G.me)break;
m=fromUci(d.m[i]);if(!m)break;
doMove(m);if(G.res)break}
note="";render()}
document.addEventListener("visibilitychange",function(){if(document.visibilityState==="visible"&&es&&view==="room"){post({t:"sync"})}});
window.addEventListener("pagehide",bye);
render();
})();
</script>
